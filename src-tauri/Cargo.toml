[package]
name = "tapper"
version = "1.4.6"
description = "固定点位 / 脚本连点器"
authors = ["Tapper"]
edition = "2021"
rust-version = "1.77.2"
default-run = "tapper"

[lib]
name = "tapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# custom-protocol 是 Tauri v2 区分 dev / release 的关键 feature。
# 缺失时 release 版会尝试连 devUrl（白屏）；裸 `cargo build --release` 不会自动打开它。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
